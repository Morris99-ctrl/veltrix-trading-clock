name: Core Edition CI

on:
  push:
    branches:
      - main
      - release/v10-core-clock
      - release/v10.11-chronological-validation
      - release/v10.12-visual-redesign
      - release/v10.13-smooth-session-clocks
  pull_request:
    branches:
      - main
      - release/v10-core-clock
      - release/v10.11-chronological-validation
      - release/v10.12-visual-redesign
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile all Python modules
        run: python -m compileall -q .

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

  windows-build:
    name: Windows desktop package
    runs-on: windows-latest
    needs: tests
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install hash-pinned build dependencies
        run: python -m pip install --require-hashes -r requirements-build.lock.txt

      - name: Build the standalone desktop application
        run: python -m PyInstaller --clean --noconfirm veltrix_windows.spec

      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe = "dist/Veltrix Trading Clock/VeltrixTradingClock.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "PyInstaller did not produce $exe"
          }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Veltrix-Trading-Clock-v10.13-Windows
          path: dist/Veltrix Trading Clock/
          if-no-files-found: error
